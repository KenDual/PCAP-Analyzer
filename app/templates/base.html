<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TANDEM{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="wordmark">Tandem</span>
      <span class="brand-sub">offline pcap triage</span>
    </a>
    <nav class="legend">
      <span><b class="t-suri">Suricata</b> signatures</span>
      <span class="legend-sep">/</span>
      <span><b>Zeek</b> observation</span>
    </nav>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    Both engines run in <strong>offline read mode</strong> only — no live interface is ever touched.
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
